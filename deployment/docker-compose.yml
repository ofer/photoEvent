services:
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "3300:3000"
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "4400:4000"
    volumes:
      - photo-storage:/app/storage
    environment:
      - PORT=4000
      - EVENT_NAME=${EVENT_NAME:-PhotoEvent}
      - EVENT_YEAR=${EVENT_YEAR:-2026}
      - CAPTURE_URL=${CAPTURE_URL:-http://localhost:3300/capture}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  photo-storage:
